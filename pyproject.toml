[project]
name = "pipelines-mcp"
version = "0.1.0"
description = "Read-only pipeline MCP server"
authors = [
    { name = "maxim-at-reveliolabs", email = "maxim@reveliolabs.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anyio",
    "boto3",
    "httpx2[http2]",
    "kubernetes",
    "mcp>=2.1.1,<3",
    "pipeline-service-client",
    "pydantic",
]

[project.scripts]
pipelines-mcp = "pipelines_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "types-boto3[s3,secretsmanager,sso-oidc,sts]>=1.43.93",
]

[[tool.uv.index]]
name = "revelio"
url = "https://pypi.cloud.reveliolabs.com/simple/"

[tool.uv.sources]
pipeline-service-client = { index = "revelio" }

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff itself tells you to ignore these)
    "COM812",   # missing trailing comma
    "ISC001",   # implicit string concat
    # Docstyle conflicts (pick D211 over D203, D212 over D213)
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",   # missing copyright notice
    "TD002",    # missing TODO author
    "TD003",    # missing TODO link
    "FIX002",   # line contains TODO (TODOs are allowed)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/pipelines_mcp/__init__.py" = [
    "D104",     # empty package init is intentional
]
"src/pipelines_mcp/k8s.py" = [
    "D102",     # kubernetes Protocol stubs
]
"src/pipelines_mcp/eks_token.py" = [
    "D102",     # Protocol stubs
]
"src/pipelines_mcp/object_store.py" = [
    "D102",     # Protocol stubs
]
"src/pipelines_mcp/pipeline_status.py" = [
    "D102",     # Protocol stubs
]
"src/pipelines_mcp/pipeline_queue.py" = [
    "D102",     # Protocol stubs
]
"src/pipelines_mcp/settings_sso.py" = [
    "N803",     # boto3 SSO argument names
    "PLR0913",  # injected SSO test seams
    "D102",     # Protocol stubs
]
"tests/**/*.py" = [
    "S101",
    "ARG",
    "PLR2004",
    "SLF001",
    "D",
]
"tests/test_settings_sso.py" = [
    "N803",     # matches live boto3 names
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "-p",
    "anyio",
]
